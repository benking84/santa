name: CI
on:
  pull_request:
    branches:
      - main
    paths:
      - "Source/**"
      - "Testing/**"
      - MODULE.bazel
      - BUILD
      - helper.bzl
      - "deps/**"
      - .github/**
      - .bazelrc

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get clang-format-20
        run: sudo apt-get install --no-install-recommends -y clang-format-20
      - name: Set clang-format-20 as default
        run: |
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-20 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-20
          clang-format --version
      - name: Run linters
        run: ./Testing/lint.sh

  check_localization:
    name: "Check Localization"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check missing localization strings
        run: |
          ./Testing/localization.py
          if [[ -n "$(git diff)" ]]; then
            git diff
            echo "Base localization has not been updated. Please run:"
            echo "    ./Testing/localization.py"
            echo "and commit any changes it makes."
            exit 1 # return an error if localization.py made changes
          fi

  check-test-suites:
    name: "Check Test Suites"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@a6c9adbb0ff4cfbb037b01d0e89dc4fb80ab3581 # ratchet:bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
      - name: Check all unit tests are in test suites
        run: ./Testing/check_test_suites.sh

  build-and-test:
    name: "Build and Test"
    needs: lint
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Auth to GCP
        if: ${{ !github.event.pull_request.head.repo.fork }} # This step will only run if it's NOT a fork
        continue-on-error: true
        id: auth
        uses: "google-github-actions/auth@f112390a2df09a12627392e64b013493f1648c2b" # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/131531281042/locations/global/workloadIdentityPools/github/providers/github"
          project_id: "santa-build-cache"
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@a6c9adbb0ff4cfbb037b01d0e89dc4fb80ab3581 # ratchet:bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.os }}
          repository-cache: true
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # ratchet:maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: |
          if [[ "${{ steps.auth.outcome }}" == "success" ]]; then
            bazel build \
              --verbose_failures \
              --sandbox_debug \
              --define=SANTA_BUILD_TYPE=adhoc \
              --remote_cache=https://storage.googleapis.com/santa-build-cache \
              --google_default_credentials \
              --remote_upload_local_results=false \
              //Source/gui:Santa
          else
            bazel build \
              --verbose_failures \
              --sandbox_debug \
              --define=SANTA_BUILD_TYPE=adhoc \
              //Source/gui:Santa
          fi
      - name: Test
        run: |
          if [[ "${{ steps.auth.outcome }}" == "success" ]]; then
            bazel test \
              --test_output=errors \
              --verbose_failures \
              --sandbox_debug \
              --define=SANTA_BUILD_TYPE=adhoc \
              --remote_cache=https://storage.googleapis.com/santa-build-cache \
              --google_default_credentials \
              --remote_upload_local_results=false \
              :unit_tests
          else
            bazel test \
              --test_output=errors \
              --verbose_failures \
              --sandbox_debug \
              --define=SANTA_BUILD_TYPE=adhoc \
              :unit_tests
          fi
