name: 'Docs: Test'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'

permissions:
  contents: read

jobs:
  test:
    name: Docs Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # ratchet:pnpm/action-setup@v6
        with:
          package_json_file: "docs/package.json"
          run_install: false

      - uses: actions/setup-node@de10085d86a2f562fb4f4fb009fb62cb210d1b06 # ratchet:actions/setup-node@v6
        with:
          node-version-file: "docs/package.json"
          cache: pnpm
          cache-dependency-path: "docs/pnpm-lock.yaml"

      - name: Install deps
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: docs
        run: pnpm test

      - name: Build
        working-directory: docs
        run: pnpm build
